# Temporary one-branch bootstrap: generate the lock on a Windows runner.
# Delete this workflow once uv.lock and requirements.txt are committed.
name: Bootstrap uv lock

on:
  push:
    branches:
      - codex/modernize-uv-structure

permissions:
  contents: write

jobs:
  generate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install uv
        run: python -m pip install uv==0.10.9
      - name: Resolve and export
        shell: pwsh
        run: |
          uv lock
          if ($LASTEXITCODE -ne 0) { throw "uv lock failed" }
          uv export --locked --no-dev --no-emit-project --no-hashes --no-annotate --output-file requirements.txt
          if ($LASTEXITCODE -ne 0) { throw "uv export failed" }
      - name: Commit generated files to migration branch
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock requirements.txt
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { Write-Host "No generated changes"; exit 0 }
          git commit -m "build: lock Nikki dependencies with uv"
          if ($LASTEXITCODE -ne 0) { throw "Commit failed" }
          git push origin HEAD:refs/heads/codex/modernize-uv-structure
          if ($LASTEXITCODE -ne 0) { throw "Push generated lock failed" }
