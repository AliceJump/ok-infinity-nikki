# One-shot Windows lock refresh for the framework upgrade PR.
# Delete after the lock and exported requirements are committed.
name: Bootstrap ok-script 2.0.14 lock

on:
  push:
    branches: [upgrade-ok-script-2-0-14]
    paths:
      - "pyproject.toml"
      - ".github/workflows/bootstrap-framework-lock.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install pinned uv
        run: python -m pip install uv==0.10.9
      - name: Resolve upgrade and export deployment requirements
        shell: pwsh
        run: |
          uv lock
          if ($LASTEXITCODE -ne 0) { throw "Dependency resolution failed" }
          uv export --locked --no-dev --no-emit-project --no-hashes --no-annotate --output-file requirements.txt
          if ($LASTEXITCODE -ne 0) { throw "Export failed" }
          uv sync --locked
          if ($LASTEXITCODE -ne 0) { throw "Install failed" }
          uv run --locked python -m unittest discover -s tests -p "TestProject*.py" -v
          if ($LASTEXITCODE -ne 0) { throw "Smoke tests failed" }
      - name: Commit uv.lock and requirements.txt back to upgrade branch
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock requirements.txt
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { Write-Host "Lock unchanged"; exit 0 }
          git commit -m "build: lock ok-script 2.0.14 and its runtime extras"
          if ($LASTEXITCODE -ne 0) { throw "Commit failed" }
          git push origin HEAD:refs/heads/upgrade-ok-script-2-0-14
          if ($LASTEXITCODE -ne 0) { throw "Push failed" }
