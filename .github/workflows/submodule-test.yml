name: Toolkit template source and runtime test

on:
  pull_request:
    branches: [main]
    paths:
      - "ok_templates"
      - ".gitmodules"
      - "ok-script-toolkit.json"
      - "assets/coco_annotations.json"
      - "assets/images/**"
      - "scripts/verify_templates.py"
      - "tests/TestProjectTemplates.py"
      - "src/config.py"
      - ".github/workflows/submodule-test.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
          fetch-depth: 1
      - name: Install PNG decoder
        run: python3 -m pip install Pillow==11.3.0
      - name: Verify submodule pin and Toolkit configuration
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          import subprocess
          root=Path('.')
          pin=subprocess.check_output(['git','rev-parse','HEAD:ok_templates'],text=True).strip()
          actual=subprocess.check_output(['git','-C','ok_templates','rev-parse','HEAD'],text=True).strip()
          assert pin == actual, (pin,actual)
          cfg=json.loads((root/'ok-script-toolkit.json').read_text('utf-8'))
          assert cfg['templates']['directory']=='ok_templates'
          assert cfg['templates']['cocoAnnotations']=='assets/coco_annotations.json'
          assert cfg['labelEnum']['name']=='FeatureList'
          source=root/'ok_templates'
          for filename in ('coco_annotations.json','boxes.json','points.json'):
              data=json.loads((source/filename).read_text('utf-8'))
              assert all(isinstance(data[key],list) for key in ('images','annotations','categories'))
          assert not (root/'x-anylabeling-asset').exists()
          print('Gitlink and Toolkit configuration verified:',pin)
          PY
      - name: Verify authoring metadata and published runtime pixels
        run: python3 scripts/verify_templates.py
