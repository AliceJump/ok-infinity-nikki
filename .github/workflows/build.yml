name: Build

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
          submodules: recursive
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pinned uv
        run: python -m pip install uv==0.10.9
      - name: Verify locked release dependencies
        shell: pwsh
        run: |
          uv lock --check
          if ($LASTEXITCODE -ne 0) { throw "uv lock mismatch" }
          uv export --locked --no-dev --no-emit-project --no-hashes --no-annotate --output-file requirements.txt
          if ($LASTEXITCODE -ne 0) { throw "uv export failed" }
          git diff --exit-code -- requirements.txt
          if ($LASTEXITCODE -ne 0) { throw "Release requirements are stale" }
          uv sync --locked
          if ($LASTEXITCODE -ne 0) { throw "uv sync failed" }
          uv run --locked python -m compileall -q src main.py main_debug.py
          if ($LASTEXITCODE -ne 0) { throw "Python compile failed" }
          uv run --locked python -m unittest discover -s tests -p "TestProject*.py" -v
          if ($LASTEXITCODE -ne 0) { throw "Project tests failed" }

  build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
          submodules: recursive
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pinned uv
        run: python -m pip install uv==0.10.9
      - name: Install dependencies
        run: |
          uv sync --locked
          pip install -r requirements.txt
      - name: Inline ok-script for release updater
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          uv run --locked python -m ok.update.inline_ok_requirements --tag "$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { throw "Inlining ok-script failed" }
      - name: Build with PyAppify Action
        uses: ok-oldking/pyappify-action@master
      - name: Append version to filenames
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          Get-ChildItem -Path pyappify_dist -File | ForEach-Object {
            Rename-Item -LiteralPath $_.FullName -NewName "$($_.BaseName)-$env:RELEASE_TAG$($_.Extension)"
          }
      - uses: actions/upload-artifact@v6
        with:
          name: pyappify_dist
          path: pyappify_dist/*

  release:
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: pyappify_dist
          path: pyappify_dist
      - uses: softprops/action-gh-release@v2
        with:
          draft: false
          body: |
            Download the Release setup.exe for installation and in-app updates.
          files: pyappify_dist/**
